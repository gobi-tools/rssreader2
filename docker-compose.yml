services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: rssreader2:dev
    container_name: rssreader2
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: /app/data/app.sqlite
    volumes:
      - app-data:/app/data

volumes:
  app-data:
